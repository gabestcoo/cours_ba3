cours: analyse3
semaine: 2
titre: "Laplacien, formules de différentiation, courbes et intégrales curvilignes"
fiches:
  - id: analyse3-s02-001
    type: definition
    titre: "Le laplacien"
    importance: 3
    corps: |
      Soit $\Omega \subset \mathbb{R}^n$ un **ouvert** et $f : \Omega \to \mathbb{R}$, $x \mapsto f(x)$, un champ scalaire
      tel que $f \in C^2(\Omega)$.

      Le **laplacien** de $f$, noté $\Delta f$ (ou $\nabla^2 f$, ou $D^2 f$), est défini par
      $$\Delta f(x) = \frac{\partial^2 f}{\partial x_1^2}(x) + \dots + \frac{\partial^2 f}{\partial x_n^2}(x) \in \mathbb{R}.$$

      *Exemple (1.5.1)* : pour $f : \mathbb{R}^3 \setminus \{(0,0,0)\} \to \mathbb{R}$, $f(x, y, z) = \frac{g\,m\,M}{r(x, y, z)}$,
      on a $\Delta f = 0$.
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 1 (section 1.5)"
    verifie: false
    incertain: null

  - id: analyse3-s02-002
    type: theoreme
    titre: "Formules de différentiation"
    importance: 3
    hypotheses: |
      $\Omega \subset \mathbb{R}^n$ un **ouvert**, $f : \Omega \to \mathbb{R}$ avec $f \in C^2(\Omega)$,
      et $F : \Omega \to \mathbb{R}^n$ avec $F \in C^2(\Omega, \mathbb{R}^n)$.
    corps: |
      1. $\Delta f = \operatorname{div}(\operatorname{grad} f)$ ;
      2. (a) si $n = 2$ : $\operatorname{curl}(\operatorname{grad} f) = 0 \in \mathbb{R}$ ;
         (b) si $n = 3$ : $\operatorname{curl}(\operatorname{grad} f) = \begin{pmatrix} 0 \\ 0 \\ 0 \end{pmatrix}$ ;
      3. si $n = 3$ : $\operatorname{div}(\operatorname{curl} F) = 0 \in \mathbb{R}$.
    remarques: |
      Preuves : (1) avec $G = \operatorname{grad} f$, $G_i = \frac{\partial f}{\partial x_i}$, donc
      $\operatorname{div} G = \sum_i \frac{\partial^2 f}{\partial x_i^2}$.
      (2b) chaque composante est du type $\frac{\partial^2 f}{\partial y \partial z} - \frac{\partial^2 f}{\partial z \partial y} = 0$.
      (3) les six dérivées secondes croisées de $\operatorname{div}(\operatorname{curl} F)$ s'annulent deux à deux.
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 2–4 (section 1.6)"
    verifie: false
    incertain: null

  - id: analyse3-s02-003
    type: definition
    titre: "Courbe simple régulière"
    importance: 3
    corps: |
      Soit $n > 1$. $\Gamma \subset \mathbb{R}^n$ est une **courbe simple régulière** (*regular simple curve*) s'il existe
      un intervalle $[a, b]$ ($a < b$) et une fonction
      $$\gamma : [a, b] \to \mathbb{R}^n, \qquad t \mapsto \gamma(t) = \big(\gamma_1(t), \dots, \gamma_n(t)\big)$$
      telle que
      - $\gamma([a, b]) = \Gamma = \{x \in \mathbb{R}^n : \exists\, t \in [a, b] \text{ t.q. } \gamma(t) = x\}$ ;
      - $\gamma$ est **injective sur $[a, b[$** : $\forall t_1, t_2 \in [a, b[$, $t_1 \neq t_2 \Rightarrow \gamma(t_1) \neq \gamma(t_2)$ ;
      - $\gamma \in C^1([a, b], \mathbb{R}^n)$ ;
      - $\|\gamma'(t)\| = \big(\gamma_1'(t)^2 + \dots + \gamma_n'(t)^2\big)^{1/2} \neq 0$ pour tout $t \in [a, b]$ (norme euclidienne).

      $\gamma$ est une **paramétrisation** de $\Gamma$. L'injectivité est demandée sur $[a, b[$ (et non $[a, b]$) pour autoriser
      $\gamma(a) = \gamma(b)$ : une courbe fermée respecte l'injectivité, une courbe qui se recoupe (boucle) non.
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 5–7 (section 2.1.1, déf. 1)"
    verifie: false
    incertain: null

  - id: analyse3-s02-004
    type: definition
    titre: "Courbe fermée, courbe régulière par morceaux"
    importance: 2
    corps: |
      **Définition 2.** $\Gamma \subset \mathbb{R}^n$ est une **courbe simple régulière fermée** (*closed*) si $\Gamma$ est une
      courbe simple régulière et $\gamma(a) = \gamma(b)$.

      **Définition 3.** $\Gamma \subset \mathbb{R}^n$ est une **courbe simple régulière par morceaux** (*piecewise*) s'il existe
      des courbes simples régulières $\Gamma_1, \Gamma_2, \dots, \Gamma_k$ telles que
      $$\Gamma = \bigcup_{i=1}^k \Gamma_i,$$
      avec des paramétrisations $\gamma_i : [a_i, b_i] \to \mathbb{R}^n$ telles que $\gamma_i(b_i) = \gamma_{i+1}(a_{i+1})$ pour $i = 1, \dots, k-1$.
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 7–8 (section 2.1.1, déf. 2–3)"
    verifie: false
    incertain: null

  - id: analyse3-s02-005
    type: formule
    titre: "Exemples de courbes : cercle, hélice, astroïde"
    importance: 2
    corps: |
      - **Cercle** de rayon 1 centré en $(0, 0)$ : $\gamma : [0, 2\pi] \to \mathbb{R}^2$, $\gamma(t) = (\cos t, \sin t)$,
        $\gamma'(t) = (-\sin t, \cos t)$, $\|\gamma'(t)\| = 1 \neq 0$ pour tout $t$ : **régulière**.
      - **Hélice** : $\gamma : [0, 2\pi] \to \mathbb{R}^3$, $\gamma(t) = (3\cos t, 3\sin t, 4t)$, de $\gamma(0) = (3, 0, 0)$
        à $\gamma(2\pi) = (3, 0, 8\pi)$ ; $\gamma'(t) = (-3\sin t, 3\cos t, 4)$,
        $\|\gamma'(t)\| = (9\sin^2 t + 9\cos^2 t + 16)^{1/2} = 5 \neq 0$ : **régulière**.
      - **Astroïde** : $\gamma : [0, 2\pi] \to \mathbb{R}^2$, $\gamma(t) = (\cos^3 t, \sin^3 t)$ ;
        $\gamma'(t) = 3(-\cos^2 t \sin t,\ \sin^2 t \cos t) \in C^1$, mais
        $\|\gamma'(t)\| = 3|\cos t \sin t| = 0$ en $t = 0, \frac{\pi}{2}, \pi, \frac{3\pi}{2}, 2\pi$ : courbe simple **non régulière**.
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 8–10 (section 2.1.2)"
    verifie: false
    incertain: null

  - id: analyse3-s02-006
    type: definition
    titre: "Intégrale curviligne d'un champ scalaire et longueur"
    importance: 3
    corps: |
      Soit $\Gamma \subset \mathbb{R}^n$ une courbe simple régulière de paramétrisation $\gamma : [a, b] \to \mathbb{R}^n$,
      et $f : \Gamma \to \mathbb{R}$ telle que $f \in C^0(\Gamma)$.

      **Définition 1.** L'**intégrale de $f$ le long de $\Gamma$** est
      $$\int_\Gamma f \, d\ell = \int_a^b f\big(\gamma(t)\big)\,\|\gamma'(t)\|\,dt.$$

      **Remarque (longueur)** : avec $f = 1$,
      $$\operatorname{length}(\Gamma) = \int_\Gamma 1 \, d\ell = \int_a^b \|\gamma'(t)\|\,dt.$$
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 11 (section 2.2.1, déf. 1)"
    verifie: false
    incertain: null

  - id: analyse3-s02-007
    type: definition
    titre: "Intégrale curviligne d'un champ vectoriel"
    importance: 3
    corps: |
      Soit $\Gamma \subset \mathbb{R}^n$ une courbe simple régulière de paramétrisation $\gamma : [a, b] \to \mathbb{R}^n$,
      et $F : \Gamma \to \mathbb{R}^n$, $x \mapsto F(x) = (F_1(x), \dots, F_n(x))$, avec $F \in C^0(\Gamma, \mathbb{R}^n)$.

      **Définition 2.** L'**intégrale de $F$ le long de $\Gamma$** est
      $$\int_\Gamma F \cdot d\ell = \int_a^b F\big(\gamma(t)\big) \cdot \gamma'(t)\,dt.$$

      **Définition 3.** Si $\Gamma = \bigcup_{i=1}^k \Gamma_i$ est **régulière par morceaux** :
      $$\int_\Gamma f \, d\ell = \sum_{i=1}^k \int_{\Gamma_i} f \, d\ell \qquad \text{ou} \qquad \int_\Gamma F \cdot d\ell = \sum_{i=1}^k \int_{\Gamma_i} F \cdot d\ell.$$
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Wed (1).pdf"
      emplacement: "p. 12 (section 2.2.1, déf. 2–3)"
    verifie: false
    incertain: null

  - id: analyse3-s02-008
    type: formule
    titre: "Exemples d'intégrales curvilignes"
    importance: 2
    corps: |
      **1a.** $f(x, y) = \sqrt{x^2 + 4y^2}$, $\gamma(t) = (t, \frac12 t^2)$, $t \in [0, 1]$ :
      $\gamma'(t) = (1, t)$, $\|\gamma'(t)\| = \sqrt{1 + t^2}$, $f(\gamma(t)) = \sqrt{t^2 + t^4} = t\sqrt{1 + t^2}$,
      $$\int_\Gamma f \, d\ell = \int_0^1 t(1 + t^2)\,dt = \frac34.$$

      **1b.** $f(x, y) = x$, $\Gamma = \{(x, y) : y = \cosh x,\ x \in [0, 1]\}$ : $\gamma(t) = (t, \cosh t)$,
      $\|\gamma'(t)\| = \sqrt{1 + \sinh^2 t} = \cosh t$,
      $$\int_\Gamma f \, d\ell = \int_0^1 t \cosh t\,dt = \sinh(1) - \cosh(1) + 1 = 1 - e^{-1}.$$

      **2a.** $F(x, y, z) = (x, z, y)$, $\gamma(t) = (\cos t, \sin t, 0)$, $t \in [0, 2\pi]$ :
      $$\int_\Gamma F \cdot d\ell = \int_0^{2\pi} (\cos t, 0, \sin t) \cdot (-\sin t, \cos t, 0)\,dt = -\int_0^{2\pi} \cos t \sin t\,dt = 0.$$

      **2b.** $F(x, y, z) = (x^2, y^3, z^2)$, $\Gamma = \{y = e^x,\ z = x,\ x \in [0, 1]\}$ : $\gamma(t) = (t, e^t, t)$,
      $$\int_\Gamma F \cdot d\ell = \int_0^1 (t^2, e^{3t}, t^2) \cdot (1, e^t, 1)\,dt = \int_0^1 (2t^2 + e^{4t})\,dt = \frac{5 + 3e^4}{12}.$$

      **3.** Cercle de rayon $R$ centré à l'origine, $\gamma(t) = R(\cos t, \sin t)$, $t \in [0, 2\pi]$ :
      $\|\gamma'(t)\| = R$, donc $\operatorname{length}(\Gamma) = \int_0^{2\pi} R\,dt = 2\pi R$.
    conditions: |
      Une courbe peut avoir plusieurs paramétrisations (ex. $\gamma : [0, 1] \to \mathbb{R}^2$, $\gamma(t) = R(\cos 2\pi t, \sin 2\pi t)$
      pour le même cercle).
    source:
      fichier: "analyse_III/semaine-02/lecture_02_Thu (1).pdf"
      emplacement: "p. 1–8 (section 2.2.2)"
    verifie: false
    incertain: null
