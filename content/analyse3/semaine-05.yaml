cours: analyse3
semaine: 5
titre: "Corollaires de Green, changement de variables, surfaces dans ℝ³"
fiches:
  - id: analyse3-s05-001
    type: theoreme
    titre: "Corollaire 2 : calcul d'aire par le bord"
    importance: 2
    hypotheses: |
      $A \subset \mathbb{R}^2$ un **domaine régulier** avec $\partial A$ **positivement orienté** ; les champs
      $F, G, H : \bar A \to \mathbb{R}^2$ définis par $F(x, y) = (-y, x)$, $G(x, y) = (0, x)$, $H(x, y) = (-y, 0)$.
    corps: |
      $$\operatorname{Area}(A) = \frac12 \int_{\partial A} F \cdot d\ell = \int_{\partial A} H \cdot d\ell = \int_{\partial A} G \cdot d\ell.$$
    remarques: |
      Esquisse : $\operatorname{curl} F = 2$, $\operatorname{curl} G = \operatorname{curl} H = 1$, donc par Green
      $\operatorname{Area}(A) = \int_A 1\,dA = \int_A \operatorname{curl} G\,dA = \int_A \operatorname{curl} H\,dA = \frac12 \int_A \operatorname{curl} F\,dA$.
      En approchant $\partial A$ par des segments $S_i$ entre $(x_i, y_i)$ et $(x_{i+1}, y_{i+1})$ :
      $\operatorname{area}(A) = \int_{\partial A} G \cdot d\ell = \sum_i \int_{S_i} G \cdot d\ell$.
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 1–2 (section 2.4.5)"
    verifie: false
    incertain: null

  - id: analyse3-s05-002
    type: theoreme
    titre: "Corollaire 3 : intégrale du laplacien"
    importance: 2
    hypotheses: |
      $A \subset \mathbb{R}^2$ un **domaine régulier** avec $\partial A$ **positivement orienté** ; $\nu : \partial A \to \mathbb{R}^2$ le champ
      des **normales unitaires extérieures** ; $f : \bar A \to \mathbb{R}$ un champ scalaire avec $f \in C^2(\bar A)$.
    corps: |
      $$\iint_A \Delta f(x, y)\,dx\,dy = \int_{\partial A} \operatorname{grad} f \cdot \nu\,d\ell.$$
    remarques: |
      Esquisse : $\Delta f = \operatorname{div}(\operatorname{grad} f)$, puis théorème de la divergence (corollaire 1) appliqué à $\operatorname{grad} f$.
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 3 (section 2.4.5)"
    verifie: false
    incertain: null

  - id: analyse3-s05-003
    type: formule
    titre: "Changement de variables dans une intégrale multiple"
    importance: 3
    corps: |
      Soit $f : \Omega \subset \mathbb{R}^n \to \mathbb{R}$, $f \in C^0(\Omega)$, avec $\Omega$ un **ouvert**. Un changement de variables
      est une fonction **bijective**
      $$u : \hat\Omega \subset \mathbb{R}^n \to \Omega \subset \mathbb{R}^n, \qquad (y_1, \dots, y_n) \mapsto u(y_1, \dots, y_n) = (x_1, \dots, x_n),$$
      avec $\hat\Omega$ ouvert : on exprime les anciennes variables en fonction des nouvelles, $x_i = u_i(y_1, \dots, y_n)$.
      $u$ est telle que le **jacobien** vérifie
      $$\det(\nabla u(y)) = \det\begin{pmatrix} \frac{\partial u_1}{\partial y_1} & \cdots & \frac{\partial u_1}{\partial y_n} \\ \vdots & & \vdots \\ \frac{\partial u_n}{\partial y_1} & \cdots & \frac{\partial u_n}{\partial y_n} \end{pmatrix} \neq 0 \quad \forall y \in \hat\Omega.$$
      Alors
      $$\int \cdots \int_\Omega f(x_1, \dots, x_n)\,dx_1 \cdots dx_n = \int \cdots \int_{\hat\Omega} f\big(u(y_1, \dots, y_n)\big)\,\|\det \nabla u(y)\|\,dy_1 \cdots dy_n.$$
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 5–7 (section 3.1.1)"
    verifie: false
    incertain: null

  - id: analyse3-s05-004
    type: formule
    titre: "Coordonnées cylindriques et sphériques"
    importance: 3
    corps: |
      **Cylindriques** $(r, \theta, z)$, $r > 0$, $\theta \in [0, 2\pi[$, $z \in \mathbb{R}$ :
      $x_1 = r\cos\theta$, $x_2 = r\sin\theta$, $x_3 = z$,
      $$\det(\nabla u) = \det\begin{pmatrix} \cos\theta & -r\sin\theta & 0 \\ \sin\theta & r\cos\theta & 0 \\ 0 & 0 & 1 \end{pmatrix} = r, \qquad \|\det \nabla u\| = r.$$
      Volume du cylindre $\{x_1^2 + x_2^2 < R^2,\ x_3 \in (0, h)\}$ : $\int_0^R \int_0^{2\pi} \int_0^h r\,dz\,d\theta\,dr = 2\pi h \int_0^R r\,dr = \pi R^2 h$.

      **Sphériques** $(r, \theta, \varphi)$, $r > 0$, $\theta \in [0, 2\pi]$, $\varphi \in [0, \pi]$ :
      $x_1 = r\sin\varphi\cos\theta$, $x_2 = r\sin\varphi\sin\theta$, $x_3 = r\cos\varphi$,
      $$\det(\nabla u) = -r^2\sin\varphi, \qquad \|\det \nabla u\| = r^2\sin\varphi \quad (r > 0,\ \varphi \in [0, \pi]).$$
      Volume de la boule $\Omega = \{x_1^2 + x_2^2 + x_3^2 < R^2\}$ :
      $\operatorname{vol}(\Omega) = \iiint_{\hat\Omega} r^2\sin\varphi\,dr\,d\theta\,d\varphi = \frac43 \pi R^3$.
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 7–9 (section 3.1.1, ex. 1–2)"
    verifie: false
    incertain: null

  - id: analyse3-s05-005
    type: definition
    titre: "Surface régulière"
    importance: 3
    corps: |
      **Notation.** Pour un champ $F : \mathbb{R}^2 \to \mathbb{R}^3$, $F(x, y) = (F_1, F_2, F_3)$, on note
      $F_{,x} = \frac{\partial F}{\partial x}$, $F_{,y} = \frac{\partial F}{\partial y}$, et $F_{\alpha, x} = \frac{\partial F_\alpha}{\partial x}$, $\alpha = 1, 2, 3$.

      **Définition 1.** $\Sigma \subset \mathbb{R}^3$ est une **surface régulière** si :
      1. il existe $A \subset \mathbb{R}^2$, un **ouvert borné**, tel que $\partial A$ est une courbe simple régulière (par morceaux) **fermée** ;
      2. il existe une fonction $\sigma : \bar A \to \mathbb{R}^3$, $(u, v) \mapsto \sigma(u, v) = (\sigma_1(u, v), \sigma_2(u, v), \sigma_3(u, v))$, telle que
         - $\sigma \in C^1(\bar A, \mathbb{R}^3)$, $\sigma(\bar A) = \Sigma$, et $\sigma$ est **injective sur $A$** ;
         - $\|\sigma_{,u} \times \sigma_{,v}\| \neq 0$ pour tout $(u, v) \in A$.

      $\sigma$ est une **paramétrisation** de $\Sigma$.
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 10–11 (section « 2.1.2 Surfaces in ℝ³ », déf. 1)"
    verifie: false
    incertain: null

  - id: analyse3-s05-006
    type: definition
    titre: "Vecteur normal et analogie courbes / surfaces"
    importance: 3
    corps: |
      $\sigma_{,u} \times \sigma_{,v}$ est le **vecteur normal** à $\Sigma$, et
      $$\nu = \frac{\sigma_{,u} \times \sigma_{,v}}{\|\sigma_{,u} \times \sigma_{,v}\|}$$
      est le **vecteur normal unitaire**. Le plan tangent en $\sigma(u, v)$ est perpendiculaire à $\sigma_{,u} \times \sigma_{,v}$ ;
      $\sigma_{,u}$ et $\sigma_{,v}$ sont tangents aux courbes $v = \text{const}$ et $u = \text{const}$.

      | courbe $\Gamma$ | surface $\Sigma$ |
      |---|---|
      | $\gamma : [a, b] \subset \mathbb{R} \to \Gamma \subset \mathbb{R}^3$ | $\sigma : \bar A \subset \mathbb{R}^2 \to \Sigma \subset \mathbb{R}^3$ |
      | $\gamma([a, b]) = \Gamma$, injective sur $[a, b[$ | $\sigma(\bar A) = \Sigma$, injective sur $A$ |
      | $\|\gamma'(t)\| \neq 0$ | $\|\sigma_{,u} \times \sigma_{,v}\| \neq 0$ |
      | $d\ell = \|\gamma'(t)\|\,dt$ | $dA = \|\sigma_{,u} \times \sigma_{,v}\|\,du\,dv$ |
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 12–13 (remarques)"
    verifie: false
    incertain: null

  - id: analyse3-s05-007
    type: definition
    titre: "Surface régulière par morceaux, surface orientable"
    importance: 2
    corps: |
      **Définition 2.** $\Sigma \subset \mathbb{R}^3$ est une surface **régulière par morceaux** s'il existe des surfaces régulières
      $\Sigma_1, \Sigma_2, \dots, \Sigma_k$ telles que $\Sigma = \bigcup_{i=1}^k \Sigma_i$.

      **Définition 3.** Une surface régulière (par morceaux) est **orientable** s'il existe un champ de normales
      $\nu : \Sigma \to \mathbb{R}^3$ **continu**. Un tel champ de normales est appelé l'**orientation** de $\Sigma$.

      Exemples de surfaces non orientables montrées en cours : le ruban de Möbius, la bouteille de Klein.
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Wed.pdf"
      emplacement: "p. 14–15 (déf. 2–3)"
    verifie: false
    incertain: null

  - id: analyse3-s05-008
    type: formule
    titre: "Exemples de surfaces : sphère et cône"
    importance: 2
    corps: |
      **Sphère** $\Sigma = \{x^2 + y^2 + z^2 = R^2\}$, $A = \,]0, 2\pi[ \times ]0, \pi[$,
      $$\sigma(\theta, \varphi) = R(\cos\theta\sin\varphi,\ \sin\theta\sin\varphi,\ \cos\varphi),$$
      $\sigma_{,\theta} = R(-\sin\theta\sin\varphi,\ \cos\theta\sin\varphi,\ 0)$, $\sigma_{,\varphi} = R(\cos\theta\cos\varphi,\ \sin\theta\cos\varphi,\ -\sin\varphi)$,
      $$\sigma_{,\theta} \times \sigma_{,\varphi} = -R\sin\varphi\,\big(R\sin\varphi\cos\theta,\ R\sin\varphi\sin\theta,\ R\cos\varphi\big) = -R\sin\varphi\;\sigma(\theta, \varphi).$$
      ($\sigma_{,\theta}$ est tangent aux cercles $\varphi = $ const, $\sigma_{,\varphi}$ aux méridiens $\theta = $ const.)

      **Cône** $\Sigma = \{z^2 = x^2 + y^2,\ 0 < z < 1\}$, $A = \,]0, 2\pi[ \times ]0, 1[$,
      $$\sigma(\theta, z) = (z\cos\theta,\ z\sin\theta,\ z), \qquad \sigma_{,\theta} \times \sigma_{,z} = (z\cos\theta,\ z\sin\theta,\ -z).$$
    source:
      fichier: "analyse_III/semaine-05/lecture_05_Thu.pdf"
      emplacement: "p. 1–3 (ex. 1–2)"
    verifie: false
    incertain: null
