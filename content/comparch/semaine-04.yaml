cours: comparch
semaine: 4
titre: "Processeur multi-cycle et entrées/sorties"
fiches:
  - id: comparch-s04-001
    type: resume
    titre: "Le processeur, une grande machine à états"
    importance: 2
    corps: |
      Sous l'ISA (le contrat entre hardware et software), le processeur est fait d'un **banc de registres**, d'une **ALU**,
      d'une **mémoire** (instructions et données), du **PC** et d'une **logique de contrôle** (lire, décoder, mettre à jour le PC).
      Vu de loin, tout le processeur est **une grande machine à états finis** (FSM).
    points_cles:
      - "**Mémoire unifiée** : instructions et données dans la même mémoire. Il n'y a plus qu'**un seul port d'adresse** : il faut un multiplexeur qui choisit entre le PC (lecture d'instruction) et le résultat de l'ALU (`lw`/`sw`)."
      - "On ne peut donc pas lire l'instruction et accéder aux données **dans le même cycle**."
      - "Les slides dessinent `PC + 1` par simplification ; RISC-V étant adressé à l'octet avec des instructions de 4 octets, c'est en réalité `PC + 4`."
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 2–5 (et notes « Processeur multicycle », section 1)"
    verifie: false
    incertain: null

  - id: comparch-s04-002
    type: resume
    titre: "Pourquoi plusieurs cycles par instruction"
    importance: 3
    corps: |
      Un processeur **mono-cycle** n'a qu'un état : « exécuter l'instruction, PC ← PC + 4 », en boucle jusqu'à `ebreak`.
      La fréquence est limitée par le **chemin critique**, le plus long chemin combinatoire entre deux registres
      (qui peuvent être le même, ex. le PC).
    points_cles:
      - "**Couper le chemin critique en deux** avec un registre double la fréquence, mais chaque instruction prend alors **2 cycles** : on ne gagne rien (on perd même un peu, à cause du registre ajouté)."
      - "**Tous les chemins ne se valent pas** : exécuter `andi` est rapide, `lw` passe par des chemins plus nombreux et plus lents. En mono-cycle, l'instruction la plus lente impose la période à toutes."
      - "**Les mémoires sont séquentielles** (synchrones) : on présente l'adresse au cycle 0, la donnée n'est valide qu'au cycle 1. Une lecture prend donc **deux états** : *Start a Load*, puis *Complete a Load*."
    schema:
      svg: |
        <svg viewBox="0 0 360 175" xmlns="http://www.w3.org/2000/svg" font-size="11"><path d="M140 20 L140 150" fill="none" class="doux" stroke-width="1" stroke-dasharray="3 3"/><path d="M230 20 L230 150" fill="none" class="doux" stroke-width="1" stroke-dasharray="3 3"/><path d="M320 20 L320 150" fill="none" class="doux" stroke-width="1" stroke-dasharray="3 3"/><text x="46" y="15" text-anchor="start" font-size="9" class="doux" stroke="none">cycle</text><text x="95" y="15" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">0</text><text x="185" y="15" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">1</text><text x="275" y="15" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">2</text><text x="48" y="42" text-anchor="end" font-size="10" fill="currentColor" stroke="none">clk</text><text x="48" y="72" text-anchor="end" font-size="10" fill="currentColor" stroke="none">address</text><text x="48" y="102" text-anchor="end" font-size="10" fill="currentColor" stroke="none">cs, read</text><text x="48" y="132" text-anchor="end" font-size="10" fill="currentColor" stroke="none">rddata</text><path d="M52 32 L95 32 L95 46 L140 46 L140 32 L185 32 L185 46 L230 46 L230 32 L275 32 L275 46 L320 46 L320 32 L345 32" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M52 70 L60 70 L66 62 L140 62 L146 70 L345 70" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M60 70 L66 78 L140 78 L146 70" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="103" y="74" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">adresse valide</text><path d="M52 106 L62 106 L62 94 L146 94 L146 106 L345 106" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M52 132 L160 132 L166 124 L226 124 L232 132 L345 132" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M160 132 L166 140 L226 140 L232 132" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="196" y="136" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">donnée</text><path d="M140 152 Q180 172 222 154" fill="none" class="acc" stroke-width="1.3"/><polygon points="222.0,154.0 216.8,159.7 214.3,153.9" class="acc-fill" stroke="none"/><text x="250" y="170" text-anchor="middle" font-size="9" class="acc" stroke="none">1 cycle de délai</text></svg>
      legende: |
        Lecture dans une mémoire synchrone : l'adresse, `cs` et `read` sont présentés au cycle 0, la mémoire
        échantillonne l'adresse au front d'horloge, et `rddata` n'est valide qu'au cycle suivant (**un cycle de délai**).
        Avec ce type de mémoire, un processeur mono-cycle est impossible.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 6–11"
    verifie: false
    incertain: null

  - id: comparch-s04-003
    type: resume
    titre: "La FSM du processeur multi-cycle"
    importance: 3
    corps: |
      Six états suffisent pour les instructions vues :
      - **Fetch1 → Fetch2** : lire l'instruction en mémoire (deux cycles, mémoire synchrone) ;
      - **Decode** : « comprendre » l'instruction et choisir le chemin suivant ;
      - **Execute** (ALU/Branch) : une instruction simple comme `andi` s'exécute en un cycle ;
      - **Load1 → Load2** : une instruction complexe comme `lw` prend plus longtemps.
    points_cles:
      - "Deux objectifs : ① **ne pas avoir trop d'états** (chaque état coûte un cycle) ; ② avoir des **chemins aussi équilibrés que possible** (la période est imposée par l'état le plus lent)."
      - "**PC ← PC + 4** une fois par tour de la FSM, c'est-à-dire une fois par instruction."
      - "Le même signal prend des valeurs différentes selon l'état : `sel_addr = 0` en Fetch1 (adresse = PC), mais `sel_addr = 1` en Load1 (adresse = résultat de l'ALU)."
    schema:
      svg: |
        <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" font-size="11"><circle cx="70" cy="50" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><circle cx="200" cy="50" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><circle cx="305" cy="120" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><circle cx="175" cy="130" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><circle cx="250" cy="205" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><circle cx="90" cy="200" r="29" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="70" y="54" text-anchor="middle" fill="currentColor" stroke="none">Fetch1</text><text x="200" y="54" text-anchor="middle" fill="currentColor" stroke="none">Fetch2</text><text x="305" y="124" text-anchor="middle" fill="currentColor" stroke="none">Decode</text><text x="175" y="127" text-anchor="middle" fill="currentColor" stroke="none">Execute</text><text x="175" y="140" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">ALU/Branch</text><text x="250" y="209" text-anchor="middle" fill="currentColor" stroke="none">Load1</text><text x="90" y="204" text-anchor="middle" fill="currentColor" stroke="none">Load2</text><path d="M99 50 L171 50" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="171.0,50.0 164.0,53.1 164.0,46.9" fill="currentColor" stroke="none"/><path d="M226 63 Q290 70 300 92" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="300.0,92.0 294.2,86.9 300.0,84.3" fill="currentColor" stroke="none"/><path d="M277 128 Q240 140 204 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="204.0,134.0 211.4,132.0 210.4,138.3" fill="currentColor" stroke="none"/><text x="244" y="150" text-anchor="middle" font-size="9" class="acc" stroke="none">ALU/Branch</text><path d="M153 112 Q120 85 93 68" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="93.0,68.0 100.6,69.1 97.2,74.4" fill="currentColor" stroke="none"/><path d="M302 149 Q300 190 278 202" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="278.0,202.0 282.6,195.9 285.7,201.4" fill="currentColor" stroke="none"/><text x="320" y="196" text-anchor="middle" font-size="9" class="acc" stroke="none">Memory</text><path d="M222 211 Q170 228 118 205" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="118.0,205.0 125.7,205.0 123.1,210.7" fill="currentColor" stroke="none"/><path d="M78 172 Q55 125 64 79" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="64.0,79.0 65.7,86.5 59.6,85.3" fill="currentColor" stroke="none"/><text x="135" y="20" text-anchor="middle" font-size="9" class="doux" stroke="none">lire l'instruction : 2 cycles</text><text x="30" y="128" text-anchor="middle" font-size="9" class="doux" stroke="none">retour</text><text x="30" y="139" text-anchor="middle" font-size="9" class="doux" stroke="none">à Fetch1</text></svg>
      legende: |
        La FSM multi-cycle : Fetch1 → Fetch2 → Decode, puis soit **Execute** (instructions ALU et branches),
        soit **Load1 → Load2** (accès mémoire), avant de revenir à Fetch1 pour l'instruction suivante.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 12–16, 31"
    verifie: false
    incertain: null

  - id: comparch-s04-004
    type: resume
    titre: "Mealy ou Moore ?"
    importance: 2
    corps: |
      - **FSM de Moore** : les sorties ne dépendent **que de l'état**.
      - **FSM de Mealy** : les sorties dépendent **de l'état et des entrées** (ici, l'instruction dans IR).
    points_cles:
      - "Moore demande parfois **plus de cycles** (un état de plus pour une sortie qui dépend de l'instruction)… et parfois ce n'est **pas acceptable**."
      - "Exemple : un seul état Execute avec `update_PC ← 1 si Branch` et `rf_we ← 1 si ALU` (Mealy), ou deux états **Execute ALU Op** (`rf_we ← 1`) et **Execute Branch Op** (`update_PC ← 1`) choisis dès Decode (Moore)."
      - "Pourquoi retester dans Execute ce qu'on a déjà testé dans Decode ? Deux états séparés **peuvent** être plus simples et plus propres… mais **les deux solutions sont correctes**."
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 17, 32"
    verifie: false
    incertain: null

  - id: comparch-s04-005
    type: resume
    titre: "Construire le chemin de données instruction par instruction"
    importance: 3
    corps: |
      On part d'une FSM « vide » et des registres de base, puis on **ajoute progressivement** ce dont chaque type
      d'instruction a besoin. Chaque ajout crée un **signal de contrôle** produit par la FSM.
    points_cles:
      - "**IR** (registre d'instruction) mémorise l'instruction venue de la mémoire ; IR et PC ne se mettent à jour que quand la FSM les **active** (`ir_en`, `pc_en`). IR est relié au contrôleur : l'état suivant dépend de l'instruction."
      - "**Type I** (`addi t0, t1, 1234`) : banc de registres + ALU, l'immédiat sur l'entrée B."
      - "**Type R** (`add t0, t1, t2`) : un second opérande ; le mux `sel_b` choisit l'immédiat ou la sortie `b` du banc de registres."
      - "**Type U** (`lui t0, 1234`) : l'immédiat est écrit directement dans le banc de registres (mux `sel_imm`)."
      - "**Load/store** (`lw t0, 16(t1)`) : l'ALU calcule l'adresse, envoyée à la mémoire via `sel_addr`. Les loads écrivent la donnée lue dans le banc de registres (mux `sel_mem`) ; les stores envoient un opérande (`b`) à la mémoire."
      - "**Branches** (`beq t0, t1, 1234`) : il faut écrire un déplacement dans le PC, et le **bit 0 du résultat de l'ALU** compte pour la mise à jour du PC. Le PC n'est plus un simple registre : il contient de la logique."
      - "**`jal`** doit écrire PC + 4 dans le banc de registres ; **`jalr x0, 0(ra)`** doit écrire une adresse (calculée par l'ALU) dans le PC."
      - "Ce qu'on met dans le contrôleur est en partie ambigu : les parties les plus triviales (ex. extraire les champs de l'instruction) sont plus claires dehors."
    schema:
      svg: |
        <svg viewBox="0 0 410 222" xmlns="http://www.w3.org/2000/svg" font-size="10"><rect x="60" y="8" width="150" height="26" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="135" y="25" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Contrôleur (FSM)</text><rect x="10" y="95" width="40" height="30" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="30" y="114" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">PC</text><path d="M66 88 L82 94 L82 126 L66 132 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="74.0" y="100" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">0</text><text x="74.0" y="127" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">1</text><rect x="100" y="70" width="64" height="90" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="132" y="106" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Mémoire</text><text x="132" y="119" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">unifiée</text><text x="104" y="113" text-anchor="start" font-size="7.5" fill="currentColor" stroke="none">addr</text><text x="160" y="98" text-anchor="end" font-size="7.5" fill="currentColor" stroke="none">rdata</text><text x="132" y="156" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none">wdata</text><rect x="185" y="80" width="34" height="30" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="202" y="99" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">IR</text><rect x="245" y="70" width="60" height="90" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="275" y="112" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Banc de</text><text x="275" y="124" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">registres</text><text x="301" y="93" text-anchor="end" font-size="8" fill="currentColor" stroke="none">a</text><text x="301" y="153" text-anchor="end" font-size="8" fill="currentColor" stroke="none">b</text><text x="249" y="151" text-anchor="start" font-size="7.5" fill="currentColor" stroke="none">wrdata</text><path d="M318 118 L334 124 L334 152 L318 158 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="326.0" y="130" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">0</text><text x="326.0" y="153" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">1</text><path d="M222 128 L238 134 L238 162 L222 168 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="230.0" y="140" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">0</text><text x="230.0" y="163" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">1</text><path d="M345 72 L380 92 L380 132 L345 152 L345 120 L352 112 L345 104 Z" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="366" y="116" text-anchor="middle" font-size="9" fill="currentColor" font-weight="600" stroke="none">ALU</text><path d="M50 110 L66 100" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="66.0,100.0 61.7,106.4 58.4,101.0" fill="currentColor" stroke="none"/><path d="M82 110 L100 110" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="100.0,110.0 93.0,113.2 93.0,106.8" fill="currentColor" stroke="none"/><path d="M164 95 L185 95" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="185.0,95.0 178.0,98.2 178.0,91.8" fill="currentColor" stroke="none"/><path d="M172 95 L172 160 L222 160" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="222.0,160.0 215.0,163.2 215.0,156.8" fill="currentColor" stroke="none"/><path d="M219 95 L245 95" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="245.0,95.0 238.0,98.2 238.0,91.8" fill="currentColor" stroke="none"/><text x="232" y="90" text-anchor="middle" font-size="7" class="doux" stroke="none">instr</text><path d="M195 80 L195 34" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="195.0,34.0 198.2,41.0 191.8,41.0" fill="currentColor" stroke="none"/><path d="M209 80 L209 52 L312 52 L312 128 L318 128" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="318.0,128.0 311.0,131.2 311.0,124.8" fill="currentColor" stroke="none"/><text x="262" y="47" text-anchor="middle" font-size="8" class="doux" stroke="none">imm</text><path d="M305 88 L345 88" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="345.0,88.0 338.0,91.2 338.0,84.8" fill="currentColor" stroke="none"/><path d="M305 150 L318 150" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="318.0,150.0 311.0,153.2 311.0,146.8" fill="currentColor" stroke="none"/><path d="M310 150 L310 192 L140 192 L140 160" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="140.0,160.0 143.2,167.0 136.8,167.0" fill="currentColor" stroke="none"/><path d="M334 138 L345 138" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="345.0,138.0 338.0,141.2 338.0,134.8" fill="currentColor" stroke="none"/><path d="M380 112 L395 112 L395 207 L58 207 L58 122 L66 122" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="66.0,122.0 59.0,125.2 59.0,118.8" fill="currentColor" stroke="none"/><path d="M215 207 L215 138 L222 138" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="222.0,138.0 215.0,141.2 215.0,134.8" fill="currentColor" stroke="none"/><path d="M238 148 L245 148" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="245.0,148.0 238.0,151.2 238.0,144.8" fill="currentColor" stroke="none"/><text x="74" y="145" text-anchor="middle" font-size="7.5" class="acc" stroke="none">sel_addr</text><text x="326" y="170" text-anchor="middle" font-size="7.5" class="acc" stroke="none">sel_b</text><text x="230" y="180" text-anchor="middle" font-size="7.5" class="acc" stroke="none">sel_mem</text><text x="202" y="120" text-anchor="middle" font-size="7.5" class="acc" stroke="none">ir_en</text><text x="275" y="66" text-anchor="middle" font-size="7.5" class="acc" stroke="none">rf_we</text><text x="36" y="89" text-anchor="middle" font-size="7.5" class="doux" stroke="none">0 : PC</text><text x="36" y="140" text-anchor="middle" font-size="7.5" class="doux" stroke="none">1 : ALU</text><text x="398" y="202" text-anchor="end" font-size="7.5" class="doux" stroke="none">alu_res</text></svg>
      legende: |
        Chemin de données **simplifié** : le mux `sel_addr` choisit l'adresse mémoire (0 : PC pour lire l'instruction,
        1 : résultat de l'ALU pour `lw`/`sw`) ; la mémoire unifiée renvoie `rdata` vers IR (instruction) ou vers le banc de
        registres via `sel_mem` (loads) ; `sel_b` choisit l'entrée B de l'ALU (0 : immédiat, 1 : registre `b`) ; la sortie
        `b` part aussi vers `wdata` pour les stores. Les chemins de `lui` (`sel_imm`), des branches et de `jal`/`jalr`
        (logique du PC) sont omis.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 18–30 (et notes « Processeur multicycle », section 4)"
    verifie: false
    incertain: null

  - id: comparch-s04-006
    type: resume
    titre: "Décrire le matériel en Verilog : méthode"
    importance: 2
    corps: |
      Verilog et VHDL sont des **langages de description de matériel**. On ne décrit quelque chose que lorsque c'est
      **parfaitement clair** : un diagramme est dessiné, et les blocs combinatoires et séquentiels sont identifiés.
    points_cles:
      - "Prêts à écrire : composants **séquentiels simples** (registres comme IR), composants **combinatoires** simples, **FSM formelle**."
      - "« Ouvrir la boîte » des choses complexes : un séquentiel complexe (ex. le PC) **n'est pas prêt**, il faut un diagramme ; un combinatoire complexe (ex. l'ALU) **probablement pas**. Ex. ALU = additionneur/soustracteur, comparateur, unité logique, unité de décalage, puis un mux de sortie."
      - "Deux motifs seulement : séquentiel `always @(posedge clk)` (registres et compteurs, avec `<=`), combinatoire `always @(*)`."
      - "**Trois blocs `always` par FSM, toujours !** (état suivant, registre d'état, sorties ; en Mealy les sorties lisent aussi les entrées)."
      - "**Attention à la simulation à délai nul** : la causalité visible avec de vrais délais disparaît ; dans les cas de débogage difficiles, redessiner le chronogramme à la main."
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 33–39"
    verifie: false
    incertain: null

  - id: comparch-s04-007
    type: resume
    titre: "Interface CPU–mémoire, carte mémoire et décodage d'adresse"
    importance: 3
    corps: |
      Vu de l'extérieur, le CPU est un composant « très » séquentiel avec une **interface mémoire** : `addr` (≥ 32 bits),
      `rdata` et `wdata` (32 bits) et des signaux de contrôle comme **CE** (*Circuit Enable* : l'adresse est valide) et
      **WE** (*Write Enable* : l'accès est un store). Une variante n'a qu'**un seul bus de données** pour lire et écrire
      (il faut alors des buffers trois états).
    points_cles:
      - "La **carte mémoire physique** dit quelle plage de l'espace d'adresses revient à quel composant : ex. la RAM entre `0x80000000` et `0x9FFFFFFF`, contenant le code, les données et la pile."
      - "**Décodage d'adresse** : les bits de poids fort de l'adresse sont comparés à une constante ; la RAM n'est activée que si `ce` est actif **et** que la comparaison est vraie."
      - "Exemple : pour `0x800A78FA`, les bits 31..20 (`0x800`) sélectionnent la RAM et les bits 19..0 (`0xA78FA`) sont l'adresse dans la RAM."
    schema:
      svg: |
