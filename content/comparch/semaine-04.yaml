  - id: comparch-s04-008
    type: resume
    titre: "Accéder aux entrées/sorties : PMIO et MMIO"
    importance: 3
    corps: |
      Les périphériques ont des débits très différents (clavier ~kbps, USB 4.0 ou HDMI 2.1 à des dizaines de Gbps).
      Deux façons d'y accéder :

      | | PMIO (*Port Mapped I/O*) | MMIO (*Memory Mapped I/O*) |
      |---|---|---|
      | espace d'adresses | séparé (numéros de port, 8–16 bits) | partagé avec la mémoire |
      | signaux | interface I/O dédiée (CE, OE) | les mêmes que la mémoire |
      | instructions | spéciales, ex. x86 `IN AL, keyboard`, `OUT` | `lw` / `sw` ordinaires |
    points_cles:
      - "MMIO : **aucun matériel spécial** dans le CPU et **aucune instruction spéciale**."
      - "Exemple : LEDs à `0x10000000`, afficheur à `0x10000010`–`0x1000002F`, boutons à `0x10000030` : `lui t0, 0x10000` puis `sw t1, 0(t0)` (écrire les LEDs) et `lw t2, 0x30(t0)` (lire les boutons)."
      - "Les LEDs sont un **registre** qui capture la donnée lors d'une **écriture** à son adresse ; les boutons sont placés sur le bus de données par un **buffer trois états** lors d'une **lecture** à leur adresse."
    schema:
      svg: |
        <svg viewBox="0 0 420 232" xmlns="http://www.w3.org/2000/svg" font-size="10"><path d="M10 184 L412 184" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="412" y="180" text-anchor="end" font-size="8" class="doux" stroke="none">Addr</text><path d="M10 202 L412 202" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="412" y="198" text-anchor="end" font-size="8" class="doux" stroke="none">Data</text><path d="M10 220 L412 220" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="412" y="216" text-anchor="end" font-size="8" class="doux" stroke="none">Ctrl</text><rect x="10" y="20" width="70" height="50" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="45" y="50" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600" stroke="none">CPU</text><rect x="100" y="20" width="76" height="50" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="138" y="50" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Mémoire</text><rect x="206" y="20" width="80" height="46" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="246" y="40" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Registre</text><text x="228" y="60" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">En</text><text x="268" y="60" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">D</text><path d="M246 20 L246 6" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="246.0,6.0 249.2,13.0 242.8,13.0" fill="currentColor" stroke="none"/><text x="262" y="10" text-anchor="start" font-size="9" fill="currentColor" stroke="none">LEDs</text><path d="M365 40 L405 40 L385 72 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M385 20 L385 40" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="385" y="14" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">Boutons</text><rect x="128" y="104" width="66" height="30" rx="3" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="161" y="116" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none">≥ 0x80000000</text><text x="161" y="128" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none">&lt; 0xA0000000</text><rect x="202" y="104" width="64" height="30" rx="3" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="234" y="123" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none">= 0x10000000</text><rect x="300" y="104" width="64" height="30" rx="3" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="332" y="123" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none">= 0x10000030</text><path d="M25 70 L25 184" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="25.0,184.0 21.9,177.0 28.1,177.0" fill="currentColor" stroke="none"/><path d="M45 70 L45 202" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="45.0,202.0 41.9,195.0 48.1,195.0" fill="currentColor" stroke="none"/><polygon points="45.0,70.0 48.1,77.0 41.9,77.0" fill="currentColor" stroke="none"/><path d="M65 70 L65 220" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="65.0,220.0 61.9,213.0 68.2,213.0" fill="currentColor" stroke="none"/><path d="M108 184 L108 70" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="108.0,70.0 111.2,77.0 104.8,77.0" fill="currentColor" stroke="none"/><path d="M118 202 L118 70" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="118.0,70.0 121.2,77.0 114.8,77.0" fill="currentColor" stroke="none"/><polygon points="118.0,202.0 114.8,195.0 121.2,195.0" fill="currentColor" stroke="none"/><path d="M161 104 L161 70" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="161.0,70.0 164.2,77.0 157.8,77.0" fill="currentColor" stroke="none"/><path d="M144 184 L144 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="144.0,134.0 147.2,141.0 140.8,141.0" fill="currentColor" stroke="none"/><path d="M180 220 L180 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="180.0,134.0 183.2,141.0 176.8,141.0" fill="currentColor" stroke="none"/><path d="M218 184 L218 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="218.0,134.0 221.2,141.0 214.8,141.0" fill="currentColor" stroke="none"/><path d="M248 220 L248 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="248.0,134.0 251.2,141.0 244.8,141.0" fill="currentColor" stroke="none"/><path d="M228 104 L228 66" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="228.0,66.0 231.2,73.0 224.8,73.0" fill="currentColor" stroke="none"/><path d="M276 202 L276 66" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="276.0,66.0 279.1,73.0 272.9,73.0" fill="currentColor" stroke="none"/><path d="M316 184 L316 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="316.0,134.0 319.1,141.0 312.9,141.0" fill="currentColor" stroke="none"/><path d="M348 220 L348 134" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="348.0,134.0 351.1,141.0 344.9,141.0" fill="currentColor" stroke="none"/><path d="M332 104 L332 56 L374 56" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="374.0,56.0 367.0,59.1 367.0,52.9" fill="currentColor" stroke="none"/><path d="M385 72 L385 202" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="385.0,202.0 381.9,195.0 388.1,195.0" fill="currentColor" stroke="none"/><text x="252" y="160" text-anchor="start" font-size="8" class="acc" stroke="none">Write</text><text x="352" y="160" text-anchor="start" font-size="8" class="acc" stroke="none">Not write</text></svg>
      legende: |
        MMIO : la mémoire est activée pour les adresses entre `0x80000000` et `0xA0000000` ; le registre des LEDs
        est activé (`En`) pour une **écriture** à `0x10000000` et capture la donnée (`D`) ; le buffer trois états des
        boutons est activé pour une **lecture** à `0x10000030` et place leur valeur sur le bus de données.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 6–10"
    verifie: false
    incertain: null

  - id: comparch-s04-009
    type: resume
    titre: "Exemple : convertisseur A/D sur un bus asynchrone"
    importance: 2
    corps: |
      Le convertisseur a une entrée **START** (lance une conversion), une sortie **/DV** (*Data Valid*, active à 0) et
      les données **D7–D0**. Le bus (proche du MC68000) a 24 bits d'adresse, 8 bits de données, et les signaux
      **/AS** (*Address Strobe* : adresse valide), **R//W** (sens du transfert) et **/DTACK** (*Data Acknowledge*).

      Interface demandée : tout accès à `0xFFFFF0` lance une conversion ; `0xFFFFF4` permet de lire DV (bit 0) ;
      `0xFFFFF8` permet de lire le résultat.
      ```riscv
      read_adc:
          li   t1, 0xfffff0
          sw   zero, 0(t1)    # lance la conversion
      poll:
          lw   t0, 4(t1)      # t0 = DV
          beqz t0, poll       # attendre la fin
      end:
          lw   a0, 8(t1)      # a0 = résultat
          ret
      ```
    points_cles:
      - "**/DTACK** doit être activé **à la fin** d'un accès, quand la donnée écrite a été capturée ou que la donnée lue est prête : c'est le **périphérique** qui signale la fin de l'accès."
      - "Le CPU reste dans l'état *Start Memory Access* (`ADDR ← ALU_res`, `/AS ← 0`) tant que `/DTACK == 1`, et termine quand `/DTACK == 0`."
      - "Le logiciel lance la conversion par une écriture, attend en lisant DV en boucle (**polling**), puis lit le résultat."
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 11–19"
    verifie: false
    incertain: null

  - id: comparch-s04-010
    type: resume
    titre: "Buffers trois états"
    importance: 2
    corps: |
      Un buffer trois états recopie son entrée quand il est activé, et « se débranche » du fil (haute impédance) sinon.
      Deux buffers dont les sorties sont reliées, activés par $\bar S$ et $S$, forment une sorte de
      **multiplexeur « décentralisé »** : $C = A$ si $S = 0$, $C = B$ si $S = 1$.
    points_cles:
      - "**S'ils ne sont pas bien contrôlés, on obtient des courts-circuits !** (deux buffers actifs qui pilotent le même fil)."
      - "Dans le système du Lab B (sur FPGA), cette fonction est réalisée par un **multiplexeur**, qui a exactement la même fonction."
    schema:
      svg: |
        <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" font-size="11"><path d="M40 50 L80 50 L60 82 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M100 50 L140 50 L120 82 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M60 20 L60 50" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M120 20 L120 50" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="60" y="15" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">A</text><text x="120" y="15" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">B</text><path d="M30 62 L48 62" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="24" y="66" text-anchor="end" fill="currentColor" font-weight="600" stroke="none">S</text><path d="M15 53 L24 53" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M150 62 L132 62" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="155" y="66" text-anchor="start" fill="currentColor" font-weight="600" stroke="none">S</text><path d="M60 82 L60 108" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="60.0,108.0 56.9,101.0 63.1,101.0" fill="currentColor" stroke="none"/><path d="M120 82 L120 108" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="120.0,108.0 116.8,101.0 123.2,101.0" fill="currentColor" stroke="none"/><path d="M45 110 L135 110" fill="none" stroke="currentColor" stroke-width="3"/><path d="M90 110 L90 138" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="90.0,138.0 86.8,131.0 93.2,131.0" fill="currentColor" stroke="none"/><text x="102" y="140" text-anchor="start" fill="currentColor" font-weight="600" stroke="none">C</text><text x="178" y="82" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">⇔</text><path d="M220 50 L300 50 L290 85 L230 85 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="240" y="64" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">0</text><text x="280" y="64" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">1</text><path d="M240 20 L240 50" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M280 20 L280 50" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="240" y="15" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">A</text><text x="280" y="15" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">B</text><path d="M296 68 L316 68" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="320" y="72" text-anchor="start" fill="currentColor" font-weight="600" stroke="none">S</text><path d="M260 85 L260 120" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="260.0,120.0 256.9,113.0 263.1,113.0" fill="currentColor" stroke="none"/><text x="260" y="136" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">C</text></svg>
      legende: |
        À gauche, deux buffers trois états reliés au même fil `C`, l'un activé par $\bar S$, l'autre par $S$ ;
        à droite, le multiplexeur 2→1 équivalent.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 20–21"
    verifie: false
    incertain: null

  - id: comparch-s04-011
    type: resume
    titre: "Périphériques programmables, UART et limites du polling"
    importance: 2
    corps: |
      Beaucoup de périphériques sont des systèmes programmables avec un **ensemble de registres** que le processeur
      lit et écrit pour (a) envoyer et recevoir des données et (b) donner des commandes et lire leur état.

      **UART** (*Universal Asynchronous Receiver-Transmitter*), avec quatre registres :

      | adresse | registre | contenu |
      |---|---|---|
      | `0x10000000` | contrôle | bit 7 = 1 pour activer ; bits 2..0 = vitesse (ex. `0b001` = 9600 baud) |
      | `0x10000004` | état | bit 1 = donnée disponible ; bit 0 = prêt à émettre |
      | `0x10000008` | données en entrée | octet reçu |
      | `0x1000000C` | données en sortie | octet à émettre |
    points_cles:
      - "Le code du slide 24 commente à tort l'adresse `0x10000000` comme « status register » et la vitesse comme « 4 bits, [3:0] » : c'est bien le registre de **contrôle**, et la vitesse est sur les **bits 2..0** (slide 23)."
      - "Envoyer une chaîne : configurer l'UART, puis pour chaque caractère attendre que le bit « prêt à émettre » vaille 1 et écrire l'octet dans le registre de sortie."
      - "**Polling** : visiter régulièrement tous les périphériques pour savoir s'ils ont des données. **Très coûteux** : si le périphérique est rapide et demande une action immédiate, le processeur passe trop de temps à vérifier."
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 22–25"
    verifie: false
    incertain: null

quiz:
  - id: comparch-s04-q001
    type: qcm
    enonce: |
      Pourquoi un processeur mono-cycle est-il impossible avec des mémoires **synchrones** ?
    choix:
      - "Parce qu'une lecture prend deux cycles : présenter l'adresse, puis récupérer la donnée"
      - "Parce qu'une mémoire synchrone ne peut pas stocker d'instructions"
      - "Parce que l'ALU ne peut pas fonctionner avec une horloge"
      - "Parce que le PC doit être incrémenté de 8"
    reponse: 0
    tolerance: null
    explication: |
      Avec une mémoire synchrone, l'adresse est échantillonnée au front d'horloge et la donnée n'est valide qu'au cycle
      suivant : **un cycle de délai**. Lire l'instruction (et, pour `lw`, la donnée) demande donc au moins deux cycles.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slide 11"
    verifie: false
    incertain: null

  - id: comparch-s04-q002
    type: vrai_faux
    enonce: |
      Couper le chemin critique en deux avec un registre, pour doubler la fréquence, améliore les performances d'un processeur mono-cycle.
    reponse: false
    tolerance: null
    explication: |
      La fréquence double, mais chaque instruction prend alors **deux cycles** : 1 instruction par cycle à $F$ contre
      1 instruction tous les deux cycles à $2F$. On ne gagne rien.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 8–9"
    verifie: false
    incertain: null

  - id: comparch-s04-q003
    type: qcm
    enonce: |
      Dans la FSM multi-cycle, vers quel état va une instruction `lw` après **Decode** ?
    choix:
      - "Load1"
      - "Execute"
      - "Fetch1"
      - "Load2"
    reponse: 0
    tolerance: null
    explication: |
      Les accès mémoire suivent le chemin **Memory** : Decode → Load1 → Load2 → Fetch1. Execute est pour les instructions
      ALU et les branches ; Load2 vient après Load1.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 15–16"
    verifie: false
    incertain: null

  - id: comparch-s04-q004
    type: numerique
    enonce: |
      Avec la FSM multi-cycle du cours (Fetch1, Fetch2, Decode, Execute, Load1, Load2), combien de cycles prend une instruction `andi` ?
    reponse: 4
    tolerance: null
    explication: |
      Fetch1 → Fetch2 → Decode → Execute : **4 cycles** (un par état), puis retour à Fetch1.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 14–16"
    verifie: false
    incertain: null

  - id: comparch-s04-q005
    type: numerique
    enonce: |
      Avec la même FSM, combien de cycles prend une instruction `lw` ?
    reponse: 5
    tolerance: null
    explication: |
      Fetch1 → Fetch2 → Decode → Load1 → Load2 : **5 cycles**. Le chargement prend deux états car la mémoire est synchrone
      (présenter l'adresse, puis récupérer la donnée).
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 15–16"
    verifie: false
    incertain: null

  - id: comparch-s04-q006
    type: qcm
    enonce: |
      À quoi sert le multiplexeur `sel_addr` devant l'adresse de la mémoire ?
    choix:
      - "À choisir entre le PC (lire une instruction) et le résultat de l'ALU (load/store)"
      - "À choisir entre deux bancs de registres"
      - "À choisir entre l'immédiat et le registre `b` pour l'ALU"
      - "À choisir entre la mémoire d'instructions et la mémoire de données"
    reponse: 0
    tolerance: null
    explication: |
      Avec une **mémoire unifiée**, il n'y a qu'un port d'adresse : en Fetch1, `sel_addr = 0` (adresse = PC) ; en Load1,
      `sel_addr = 1` (adresse = ALU). Le choix immédiat/registre pour l'ALU est le rôle de `sel_b`.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 4, 25, 31"
    verifie: false
    incertain: null

  - id: comparch-s04-q007
    type: qcm
    enonce: |
      Pourquoi le processeur multi-cycle a-t-il besoin d'un **registre d'instruction** (IR) ?
    choix:
      - "Pour garder l'instruction pendant toute son exécution, alors que la sortie de la mémoire change"
      - "Pour stocker l'adresse de retour des fonctions"
      - "Pour accélérer les calculs de l'ALU"
      - "Pour remplacer le banc de registres"
    reponse: 0
    tolerance: null
    explication: |
      L'instruction arrive de la mémoire en Fetch2, mais la sortie de la mémoire change ensuite (ex. lors d'un `lw`).
      IR **mémorise** l'instruction ; il n'est mis à jour que lorsque la FSM l'active (`ir_en`).
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slide 19"
    verifie: false
    incertain: null

  - id: comparch-s04-q008
    type: qcm
    enonce: |
      Qu'est-ce qui distingue une FSM de **Moore** d'une FSM de **Mealy** ?
    choix:
      - "En Moore, les sorties ne dépendent que de l'état ; en Mealy, de l'état et des entrées"
      - "En Moore, les sorties dépendent de l'état et des entrées ; en Mealy, de l'état seulement"
      - "Une FSM de Moore n'a pas de registre d'état"
      - "Une FSM de Mealy n'a qu'un seul état"
    reponse: 0
    tolerance: null
    explication: |
      Moore : sorties = fonction de l'état seulement (demande parfois plus d'états, donc plus de cycles).
      Mealy : sorties = fonction de l'état **et** des entrées (ici, l'instruction).
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slide 17"
    verifie: false
    incertain: null

  - id: comparch-s04-q009
    type: vrai_faux
    enonce: |
      Pour `sw t0, 16(t1)`, l'ALU calcule l'adresse `t1 + 16`, et la donnée envoyée à la mémoire est la seconde sortie du banc de registres.
    reponse: true
    tolerance: null
    explication: |
      Le store doit envoyer un **opérande** à la mémoire : la valeur de `t0`, lue sur la sortie `b` du banc de registres,
      part vers `wdata`, tandis que l'ALU calcule l'adresse avec l'immédiat.
    source:
      fichier: "computer_architecture/semaine-04/2a. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 25, 27"
    verifie: false
    incertain: null

  - id: comparch-s04-q010
    type: qcm
    enonce: |
      La RAM commence à l'adresse `0x80000000`. Pour l'adresse `0x800A78FA`, comment la RAM est-elle sélectionnée ?
    choix:
      - "Les bits 31..20 sont comparés à `0x800`, et le résultat est combiné avec `ce`"
      - "Les bits 19..0 sont comparés à `0xA78FA`"
      - "La RAM répond à toutes les adresses"
      - "Le CPU utilise une instruction spéciale pour la RAM"
    reponse: 0
    tolerance: null
    explication: |
      **Décodage d'adresse** : un comparateur teste les bits de poids fort (`addr[31:20] = 0x800`) ; une porte ET avec `ce`
      donne `en` de la RAM. Les bits 19..0 sont l'adresse **à l'intérieur** de la RAM.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 4–5"
    verifie: false
    incertain: null

  - id: comparch-s04-q011
    type: qcm
    enonce: |
      Quel est l'avantage principal des **entrées/sorties mappées en mémoire** (MMIO) ?
    choix:
      - "On accède aux périphériques avec des `lw`/`sw` ordinaires, sans matériel ni instruction spéciale dans le CPU"
      - "Les périphériques ont leur propre espace d'adresses séparé"
      - "On utilise des instructions dédiées comme `IN` et `OUT`"
      - "Les périphériques ne passent plus par le bus"
    reponse: 0
    tolerance: null
    explication: |
      En MMIO, les registres des périphériques sont des **adresses mémoire** : `lw`/`sw` suffisent. L'espace séparé et les
      instructions `IN`/`OUT` (x86) caractérisent le **PMIO**.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 8–9"
    verifie: false
    incertain: null

  - id: comparch-s04-q012
    type: qcm
    enonce: |
      Sur le bus du convertisseur A/D, quel est le rôle du signal **/DTACK** ?
    choix:
      - "Le périphérique l'active pour signaler que l'accès est terminé (donnée prête ou capturée)"
      - "Le CPU l'active pour indiquer qu'une adresse valide est sur le bus"
      - "Il indique le sens du transfert (lecture ou écriture)"
      - "Il lance une conversion"
    reponse: 0
    tolerance: null
    explication: |
      /DTACK (*Data Acknowledge*) est une **entrée** du CPU, activée à la fin de l'accès : le CPU attend tant que
      `/DTACK == 1`. L'adresse valide est signalée par **/AS**, le sens par **R//W**, et la conversion est lancée par START.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 12, 16"
    verifie: false
    incertain: null

  - id: comparch-s04-q013
    type: qcm
    enonce: |
      Deux buffers trois états, l'un activé par $\bar S$ (entrée A) et l'autre par $S$ (entrée B), ont leurs sorties reliées. Quelle fonction réalisent-ils ?
    choix:
      - "Un multiplexeur 2→1 : la sortie vaut A si S = 0, B si S = 1"
      - "Une porte ET entre A et B"
      - "Une porte OU entre A et B"
      - "Un registre qui mémorise A ou B"
    reponse: 0
    tolerance: null
    explication: |
      Un seul buffer est actif à la fois et recopie son entrée sur le fil commun : c'est une sorte de **multiplexeur
      décentralisé**. Dans le Lab B (FPGA), on utilise directement un multiplexeur.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slides 20–21"
    verifie: false
    incertain: null

  - id: comparch-s04-q014
    type: vrai_faux
    enonce: |
      Si des buffers trois états reliés au même fil ne sont pas correctement contrôlés, on peut provoquer un court-circuit.
    reponse: true
    tolerance: null
    explication: |
      Si deux buffers actifs pilotent le même fil avec des valeurs différentes, on obtient un **court-circuit** : il faut
      garantir (par exemple par le décodage d'adresse) qu'au plus un buffer est actif à la fois.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slide 20"
    verifie: false
    incertain: null

  - id: comparch-s04-q015
    type: qcm
    enonce: |
      Quel est le principal défaut du **polling** des périphériques ?
    choix:
      - "Le processeur passe beaucoup de temps à vérifier si les périphériques ont des données"
      - "Il nécessite un contrôleur matériel spécial"
      - "Il ne fonctionne qu'avec les périphériques PMIO"
      - "Il empêche d'utiliser `lw` et `sw`"
    reponse: 0
    tolerance: null
    explication: |
      Avec le polling, le CPU visite régulièrement tous les périphériques. C'est **très coûteux** : si un périphérique est
      rapide et demande une action immédiate, le processeur doit vérifier trop souvent. Le polling se fait justement avec
      des `lw` ordinaires, sans matériel spécial.
    source:
      fichier: "computer_architecture/semaine-04/2b. Processor, IOs, and Exceptions (2).pdf"
      emplacement: "slide 25"
    verifie: false
    incertain: null
