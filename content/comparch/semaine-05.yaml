cours: comparch
semaine: 5
titre: "Interruptions, DMA, timer et exceptions"
fiches:
  - id: comparch-s05-001
    type: resume
    titre: "Les interruptions d'entrée/sortie"
    importance: 3
    corps: |
      Le **polling** est très coûteux : si un périphérique est rapide et demande une action immédiate, le processeur passe
      trop de temps à vérifier. **Idée des interruptions** : ne pas vérifier les périphériques tout le temps, mais les laisser
      **« demander » l'attention**. Le programme en cours est alors interrompu au profit d'un **gestionnaire d'interruption**
      (*interrupt handler*, ex. `read_adc`), puis reprend.
    points_cles:
      - "Mécanismes semblables dans certains langages (callbacks, listeners, signaux, promises…), mais là il y a des compilateurs et interpréteurs ; ici, plus rien de tout ça."
      - "Vue (très naïve) du matériel : un multiplexeur devant le PC, commandé par la ligne **IRQ** (*Interrupt Request*), charge l'adresse du gestionnaire. Il faut aussi **sauver l'endroit où l'on exécutait**."
      - "Questions à régler : **qui** demande l'attention (le logiciel interroge ensuite tous les périphériques, ou le périphérique envoie son identité) ; **quelles priorités** (certains peuvent attendre longtemps, d'autres non) ; **quel impact** sur l'exécution en cours (combien d'instructions se terminent ? que devient le programme ?)."
      - "Séquence type : ① le périphérique demande l'attention par **IREQ** ; ② le processeur signale qu'il est prêt par **IACK** (*acknowledge*) ; ③ le périphérique donne son identité ; ④ le processeur transfère le contrôle au gestionnaire approprié ; ⑤ il revient à la tâche interrompue."
      - "Le périphérique **maintient sa requête jusqu'à ce qu'elle soit acquittée**."
    source:
      fichier: "computer_architecture/semaine-05/2c. Processor, IOs, and Exceptions (1).pdf"
      emplacement: "slides 2–9"
    verifie: false
    incertain: null

  - id: comparch-s05-002
    type: resume
    titre: "Plusieurs périphériques sur une seule ligne IRQ : le OU câblé"
    importance: 2
    corps: |
      Comment connecter beaucoup de périphériques à une seule entrée IRQ ? Plutôt qu'une grande porte OU, chaque périphérique
      a une sortie **trois états** : s'il ne demande rien (0), il se met en **haute impédance (Z)** ; s'il demande (1), il pilote 1.
      Une **grande résistance** relie la ligne à 0 : une « voix très faible » qui dit 0, « inaudible » si quelqu'un « crie » 1.
    points_cles:
      - "On obtient une sorte de **OU « décentralisé »** (*wired-OR*) : la ligne vaut 1 si au moins un périphérique demande."
      - "Le slide précise que ce n'est « pas tout à fait le vrai circuit »."
    schema:
      svg: |
        <svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-size="10"><path d="M60 22 L60 50" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="60" y="16" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">IRQ₀</text><path d="M40 50 L80 50 L60 82 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M60 36 L90 36 L90 64 L72 64" fill="none" stroke="currentColor" stroke-width="1"/><path d="M60 82 L60 120" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M130 22 L130 50" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="130" y="16" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">IRQ₁</text><path d="M110 50 L150 50 L130 82 Z" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M130 36 L160 36 L160 64 L142 64" fill="none" stroke="currentColor" stroke-width="1"/><path d="M130 82 L130 120" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M60 120 L200 120" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M95 120 L95 150" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="95.0,150.0 91.8,143.0 98.2,143.0" fill="currentColor" stroke="none"/><text x="95" y="166" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">IRQ₀ OU IRQ₁</text><rect x="193" y="132" width="14" height="30" rx="1" class="bloc" stroke="currentColor" stroke-width="1.5"/><path d="M200 120 L200 132" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M200 162 L200 172" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M186 172 L214 172" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="222" y="176" text-anchor="start" fill="currentColor" font-weight="600" stroke="none">0</text><text x="216" y="140" text-anchor="start" font-size="8" class="acc" stroke="none">grande résistance :</text><text x="216" y="151" text-anchor="start" font-size="8" class="acc" stroke="none">« voix faible » qui dit 0</text><text x="190" y="40" text-anchor="start" font-size="8.5" class="acc" stroke="none">si 0 → Z, si 1 → 1</text></svg>
      legende: |
        Deux périphériques partagent la ligne IRQ : chacun ne pilote la ligne que lorsqu'il demande (1) et est déconnecté (Z)
        sinon ; la résistance ramène la ligne à 0 quand personne ne demande. Résultat : IRQ₀ OU IRQ₁.
    source:
      fichier: "computer_architecture/semaine-05/2c. Processor, IOs, and Exceptions (1).pdf"
      emplacement: "slide 7"
    verifie: false
    incertain: null

  - id: comparch-s05-003
    type: resume
    titre: "Priorités des interruptions : chaîne et contrôleur"
    importance: 2
    corps: |
      **Arbitrage en chaîne** (*daisy chain*), l'une des méthodes les plus simples :
      - n'importe quel périphérique place une requête (IREQ, *Request*) ;
      - la ligne d'acquittement (IACK, *Grant*) passe d'un périphérique au suivant ;
      - le périphérique qui veut l'accès **intercepte** le signal et le cache aux suivants.
    points_cles:
      - "Simple, mais ① **lent** et ② **priorités figées** (la position dans la chaîne fixe la priorité)."
      - "Un **contrôleur d'interruptions** (matériel spécial) peut : ne propager qu'**une IREQ à la fois** au processeur (la plus prioritaire, ou à priorité égale celle servie il y a le plus longtemps) ; renvoyer l'IACK au bon périphérique ; **interdire** certains périphériques ; permettre l'**imbrication** (une IREQ plus prioritaire passe pendant qu'une moins prioritaire est servie)."
    schema:
      svg: |
        <svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" font-size="10"><rect x="10" y="95" width="70" height="50" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="45" y="117" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Arbitre</text><text x="45" y="130" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">(processeur)</text><rect x="120" y="30" width="64" height="34" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="152" y="51" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Périph. 1</text><rect x="215" y="30" width="64" height="34" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="247" y="51" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Périph. 2</text><rect x="320" y="30" width="64" height="34" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="352" y="51" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Périph. n</text><text x="152" y="22" text-anchor="middle" font-size="8" class="acc" stroke="none">priorité haute</text><text x="352" y="22" text-anchor="middle" font-size="8" class="acc" stroke="none">priorité basse</text><text x="298" y="51" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">…</text><path d="M80 105 L100 105 L100 80 L130 80 L130 64" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="130.0,64.0 133.2,71.0 126.8,71.0" fill="currentColor" stroke="none"/><path d="M170 64 L170 80 L225 80 L225 64" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="225.0,64.0 228.2,71.0 221.8,71.0" fill="currentColor" stroke="none"/><path d="M265 64 L265 80 L330 80 L330 64" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/><polygon points="330.0,64.0 333.1,71.0 326.9,71.0" fill="currentColor" stroke="none"/><text x="115" y="92" text-anchor="middle" font-size="8" class="doux" stroke="none">Grant</text><text x="197" y="92" text-anchor="middle" font-size="8" class="doux" stroke="none">Grant</text><text x="298" y="92" text-anchor="middle" font-size="8" class="doux" stroke="none">Grant</text><path d="M360 64 L360 150 L80 150" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="80.0,150.0 87.0,146.8 87.0,153.2" fill="currentColor" stroke="none"/><path d="M150 64 L150 150" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M245 64 L245 150" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="300" y="163" text-anchor="middle" font-size="8" class="doux" stroke="none">Request (IREQ)</text></svg>
      legende: |
        Chaîne d'arbitrage : tous les périphériques partagent la ligne *Request* ; le *Grant* part de l'arbitre (le processeur
        ou un intermédiaire) et passe de périphérique en périphérique. Le premier qui a une requête garde le *Grant* :
        le périphérique 1 a la priorité la plus haute.
    source:
      fichier: "computer_architecture/semaine-05/2c. Processor, IOs, and Exceptions (1).pdf"
      emplacement: "slides 10–12"
    verifie: false
    incertain: null

  - id: comparch-s05-004
    type: resume
    titre: "Accès direct à la mémoire (DMA)"
    importance: 3
    corps: |
      Les interruptions évitent de vérifier sans cesse les périphériques, mais le processeur peut encore perdre beaucoup de
      temps à **transférer de gros volumes de données** (disques, réseau) : un load puis un store, peut-être 1 000 000 de fois.
      **Idée** : un périphérique spécial, le **DMA** (*Direct Memory Access*), fait ces transferts entre périphérique et mémoire,
      et **libère le processeur** pour calculer.
    points_cles:
      - "Contenu minimal d'un DMA : un **registre d'incrément** (combien d'octets/mots par transfert), deux **pointeurs d'adresse** (source et destination, incrémentés à chaque transfert) et un **compteur** (nombre total à transférer)."
      - "Séquence : ① le processeur indique au DMA le périphérique, l'adresse mémoire et le nombre d'octets ; ② le DMA devient **maître du bus** et fait les accès en pilotant directement les bus d'adresse et de contrôle ; ③ le DMA envoie une **interruption** pour signaler la fin (ou une erreur)."
      - "Le DMA doit contrôler le bus… mais le maître est le processeur : celui-ci doit **céder le bus**, et le reprend quand le DMA envoie une interruption. Il a besoin d'« un peu de mémoire » pour travailler sans accès au bus."
      - "**Timer** : un périphérique qui compte jusqu'à `max` et envoie une interruption ; `max` est programmable, le processeur choisit donc la fréquence des interruptions."
    schema:
      svg: |
        <svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" font-size="10"><path d="M10 172 L412 172" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 190 L412 190" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="412" y="168" text-anchor="end" font-size="8" class="doux" stroke="none">A</text><text x="412" y="186" text-anchor="end" font-size="8" class="doux" stroke="none">D</text><rect x="10" y="70" width="74" height="60" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="47.0" y="98" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Processeur</text><path d="M26 130 L26 172" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="26.0,172.0 22.9,165.0 29.1,165.0" fill="currentColor" stroke="none"/><path d="M68 130 L68 190" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="68.0,190.0 64.8,183.0 71.2,183.0" fill="currentColor" stroke="none"/><polygon points="68.0,130.0 71.2,137.0 64.8,137.0" fill="currentColor" stroke="none"/><rect x="95" y="70" width="74" height="60" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="132.0" y="98" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Mémoire</text><path d="M111 130 L111 172" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="111.0,172.0 107.8,165.0 114.2,165.0" fill="currentColor" stroke="none"/><polygon points="111.0,130.0 114.2,137.0 107.8,137.0" fill="currentColor" stroke="none"/><path d="M153 130 L153 190" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="153.0,190.0 149.8,183.0 156.2,183.0" fill="currentColor" stroke="none"/><polygon points="153.0,130.0 156.2,137.0 149.8,137.0" fill="currentColor" stroke="none"/><rect x="180" y="70" width="64" height="60" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="212.0" y="98" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Périph.</text><path d="M196 130 L196 172" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="196.0,172.0 192.8,165.0 199.2,165.0" fill="currentColor" stroke="none"/><polygon points="196.0,130.0 199.2,137.0 192.8,137.0" fill="currentColor" stroke="none"/><path d="M228 130 L228 190" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="228.0,190.0 224.8,183.0 231.2,183.0" fill="currentColor" stroke="none"/><polygon points="228.0,130.0 231.2,137.0 224.8,137.0" fill="currentColor" stroke="none"/><rect x="255" y="70" width="64" height="60" rx="4" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="287.0" y="98" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">Périph.</text><path d="M271 130 L271 172" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="271.0,172.0 267.9,165.0 274.1,165.0" fill="currentColor" stroke="none"/><polygon points="271.0,130.0 274.1,137.0 267.9,137.0" fill="currentColor" stroke="none"/><path d="M303 130 L303 190" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="303.0,190.0 299.9,183.0 306.1,183.0" fill="currentColor" stroke="none"/><polygon points="303.0,130.0 306.1,137.0 299.9,137.0" fill="currentColor" stroke="none"/><text x="47" y="82" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">IRQs</text><rect x="335" y="30" width="75" height="100" rx="4" class="bloc" stroke="currentColor" stroke-width="1.5"/><text x="372" y="46" text-anchor="middle" fill="currentColor" font-weight="600" stroke="none">DMA</text><rect x="345" y="54" width="55" height="17" rx="2" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="372" y="66" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">from</text><rect x="345" y="76" width="55" height="17" rx="2" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="372" y="88" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">to</text><rect x="345" y="98" width="55" height="17" rx="2" class="bloc-acc" stroke="currentColor" stroke-width="1.5"/><text x="372" y="110" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none">count</text><path d="M352 130 L352 172" fill="none" class="acc" stroke-width="2"/><polygon points="352.0,172.0 348.9,165.0 355.1,165.0" class="acc-fill" stroke="none"/><path d="M395 130 L395 190" fill="none" stroke="currentColor" stroke-width="1.3"/><polygon points="395.0,190.0 391.9,183.0 398.1,183.0" fill="currentColor" stroke="none"/><polygon points="395.0,130.0 398.1,137.0 391.9,137.0" fill="currentColor" stroke="none"/><path d="M372 30 L372 14 L40 14 L40 70" fill="none" class="acc" stroke-width="1.6"/><polygon points="40.0,70.0 36.9,63.0 43.1,63.0" class="acc-fill" stroke="none"/><text x="206" y="10" text-anchor="middle" font-size="8" class="acc" stroke="none">interruption de fin de transfert</text></svg>
      legende: |
        Le DMA, programmé avec `from`, `to` et `count`, pilote le bus d'adresses pendant le transfert (lecture puis écriture,
        sans passer par le processeur) ; à la fin, il prévient le processeur par une interruption.
    source:
